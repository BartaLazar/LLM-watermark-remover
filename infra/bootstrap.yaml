AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time setup for deploying the synreplace web app to Lambda from GitHub
  Actions: image registry, GitHub OIDC login, deploy role, and the Lambda's own
  role and log group. Deploy once by hand from CloudShell (see infra/README.md);
  everything after that is deployed by GitHub Actions.

Parameters:
  GitHubRepo:
    Type: String
    # GitHub's "immutable subject" format: owner and repo name, each with its
    # numeric ID (public: `gh api repos/OWNER/REPO -q .id`). A repo deleted and
    # recreated under the same name gets a new ID, so it can't deploy here.
    # Check the current format with:
    #   gh api repos/OWNER/REPO/actions/oidc/customization/sub
    Default: BartaLazar@79648914/LLM-watermark-remover@1339776408
    Description: GitHub OIDC subject prefix (owner@id/repo@id) of the only repo allowed to deploy.
  GitHubBranch:
    Type: String
    Default: main
    Description: The only branch allowed to deploy.
  AppName:
    Type: String
    Default: synreplace-web
    Description: Name shared by the ECR repository, the Lambda function and its log group.
  AppStackName:
    Type: String
    Default: synreplace-app
    Description: Name of the CloudFormation stack GitHub Actions deploys (the Lambda itself).

Resources:
  # Lets this AWS account trust login tokens issued by GitHub Actions.
  # An account can only have one of these per URL.
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # Where the container images live. Only the 2 newest are kept, to keep the
  # storage cost near $0; tags are immutable so an image can't be silently replaced.
  ImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref AppName
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the 2 newest images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 2
                },
                "action": { "type": "expire" }
              }
            ]
          }
      # Lets the Lambda service pull images, but only for functions in this account.
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaPull
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              StringLike:
                aws:sourceArn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:*

  # Created here (not by the app stack) so it can't be deleted and recreated
  # without a retention limit; 14 days keeps CloudWatch Logs inside the free tier.
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AppName}
      RetentionInDays: 14

  # The identity the app itself runs as: it can only write its own logs.
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Runtime role of the synreplace web Lambda.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteOwnLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${AppLogGroup.Arn}

  # The role GitHub Actions assumes. Only workflows from GitHubRepo running on
  # GitHubBranch can use it, and it can only touch this app's own resources.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by GitHub Actions (OIDC) to deploy the synreplace web app.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:ref:refs/heads/${GitHubBranch}
      Policies:
        - PolicyName: DeploySynreplaceWeb
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # docker login to ECR; this action can't be scoped to a repository.
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPushPull
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeImages
                Resource: !GetAtt ImageRepository.Arn
              - Sid: CloudFormationValidate
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                Resource: "*"
              - Sid: CloudFormationAppStack
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*
              - Sid: ManageTheFunction
                Effect: Allow
                Action:
                  # Read anything about this one function: CloudFormation reads
                  # more settings (code signing, runtime config, ...) than it changes.
                  - lambda:Get*
                  - lambda:ListTags
                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:DeleteFunction
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:CreateFunctionUrlConfig
                  - lambda:UpdateFunctionUrlConfig
                  - lambda:DeleteFunctionUrlConfig
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:PutFunctionConcurrency
                  - lambda:DeleteFunctionConcurrency
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppName}
              # Can hand the pre-made runtime role to Lambda, and nothing else.
              - Sid: PassOnlyTheRuntimeRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt LambdaExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com

Outputs:
  DeployRoleArn:
    Description: Store in GitHub as repository secret AWS_DEPLOY_ROLE_ARN (contains the account ID).
    Value: !GetAtt GitHubDeployRole.Arn
  ImageRepositoryUri:
    Description: Store in GitHub as repository secret ECR_REPOSITORY_URI (contains the account ID).
    Value: !GetAtt ImageRepository.RepositoryUri
  LambdaExecutionRoleArn:
    Description: Runtime role, read by the app stack.
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-LambdaExecutionRoleArn
