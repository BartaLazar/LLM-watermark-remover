<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280">
  <!-- Fine paper fibre: low-alpha noise laid over the paper colour. -->
  <filter id="fibre" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.31  0 0 0 0 0.22  0.16 0 0 0 0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#fibre)"/>
</svg>
