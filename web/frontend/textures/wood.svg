<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360">
  <!-- Walnut, as two layers of noise stretched along x, both mapped to dark
       brown with alpha so the base colour in style.css shows through:
       soft figure bands, then crisp grain lines (a steep alpha curve turns
       the noise into thin, sharp-edged streaks). -->
  <filter id="figure" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0018 0.05" numOctaves="3" seed="4" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.13  0 0 0 0 0.07  0 0 0 0 0.03  1.3 0 0 0 -0.5"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0025 0.16" numOctaves="4" seed="9" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.09  0 0 0 0 0.045  0 0 0 0 0.02  4.5 0 0 0 -2.2"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#figure)"/>
  <rect width="100%" height="100%" filter="url(#grain)" opacity="0.6"/>
</svg>
