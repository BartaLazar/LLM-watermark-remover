<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320">
  <!-- Walnut grain: noise stretched along x, mapped to dark streaks with
       alpha so the base colour in style.css shows through. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.09" numOctaves="4" seed="11" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.09  0 0 0 0 0.04  1.9 0 0 0 -0.62"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#grain)"/>
</svg>
